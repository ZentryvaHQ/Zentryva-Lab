name: OpenAI credential check

on:
  workflow_dispatch:
  push:
    branches:
      - "chore/openai-credential-check"
    paths:
      - ".github/workflows/openai-credential-check.yml"

permissions:
  contents: read

jobs:
  verify-openai-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm secret is configured
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::error::OPENAI_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Validate credential with OpenAI
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          status_code="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENAI_API_KEY}" \
            https://api.openai.com/v1/models)"

          if [[ "${status_code}" != "200" ]]; then
            echo "::error::OpenAI credential validation failed with HTTP ${status_code}."
            exit 1
          fi

          echo "OPENAI_API_KEY is configured and accepted by OpenAI."
