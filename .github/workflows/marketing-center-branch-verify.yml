name: Marketing Center branch verification

on:
  push:
    branches:
      - mc-p0-supervision-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r marketing-center/requirements.txt
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q marketing-center/mc marketing-center/tests
      - name: Portable regression suite
        working-directory: marketing-center
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Record revision
        run: |
          git rev-parse HEAD
          git status --porcelain
