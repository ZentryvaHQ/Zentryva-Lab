[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentryva-thinktank"
version = "1.0.0"
description = "Evidence-first research intelligence and opportunity radar for Zentryva"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Zentryva"}]
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
zthink = "zentryva_thinktank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
